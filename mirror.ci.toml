# Configuration used by .github/workflows/backfill.yml.
#
# No credentials live here: the `ghcr` target authenticates with the Docker
# config the workflow creates from `GITHUB_TOKEN`, and the ledger uses the git
# authentication configured in the job environment.
#
# This file mirrors every project, but only its current major line: the globs
# below select the latest major release and every minor and bug release under
# it, not the whole version history. When upstream starts a new major, bump the
# project's glob; until then the new line is ignored.
#
# The workflow bounds each run with --limit / --limit-bytes; the ledger cursor
# carries the position into the next scheduled run.

state_dir = "~/.local/state/cinc-mirror"
concurrency = 4
upload_concurrency = 2

[[projects]]
id = "cinc"
project = "cinc"
channel = "stable"
versions = ["19.*"]
platforms = "*"
arches = "*"

[[projects]]
id = "cinc-auditor"
project = "cinc-auditor"
channel = "stable"
versions = ["7.*"]
platforms = "*"
arches = "*"

[[projects]]
id = "cinc-foundation"
project = "cinc-foundation"
channel = "stable"
versions = ["3.*"]
platforms = "*"
arches = "*"

[[projects]]
id = "cinc-server"
project = "cinc-server"
channel = "stable"
versions = ["15.*"]
platforms = "*"
arches = "*"

[[projects]]
id = "cinc-workstation"
project = "cinc-workstation"
channel = "stable"
versions = ["26.*"]
platforms = "*"
arches = "*"

[[projects]]
id = "omnibus-toolchain"
project = "omnibus-toolchain"
channel = "stable"
versions = ["26.*"]
platforms = "*"
arches = "*"

# `omnibus-toolchain` is the build toolchain rather than a Cinc product. Its
# Windows formats (`.msi`/`.appx`) and in-place rebuilds share descriptive tags,
# so every crawl reports collisions. They are mirrored under digest-qualified
# tags either way; the incident opt-out below keeps the pair reports out of the
# ledger, the alerts and the issues.

[incident]
ignore_arch_collisions = ["omnibus-toolchain"]

[retention]
# Without this the registry only grows: the globs above are the policy.
prune = true

[ledger]
branch = "ledger"
remote = "origin"

[[targets]]
name = "ghcr"
kind = "oci"
registry = "ghcr.io"
namespace = "rmoriz/cinc-mirror"
auth = "docker"
