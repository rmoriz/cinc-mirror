[package]
name = "cinc-mirror"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Mirror CINC packages from upstream to OCI registries and rsync targets"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
futures = "0.3"
indicatif = "0.18"
libc = "0.2"
percent-encoding = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
suppaftp = { version = "13", features = ["tokio", "tokio-rustls-ring"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
url = "2"
webpki-roots = "1"

[lints.cargo]
# Dependencies are declared up front by the implementation plan and are wired
# into the modules task by task; the manifest lint would otherwise fire until
# the last of them is used.
unused_dependencies = "allow"

[dev-dependencies]
assert_cmd = "2"
axum = "0.7"
libunftp = { version = "0.25", default-features = false, features = ["ring"] }
unftp-core = "0.1"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
